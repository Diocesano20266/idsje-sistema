<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSJE — Sistema Académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --gold:  #d4af37;
            --navy:  #07101f;
            --text:  #e8e4d9;
            --muted: #8a94a8;
        }

        html, body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* Fondo: logo a pantalla completa */
        .bg {
            position: fixed;
            inset: 0;
            background-image: url('https://raw.githubusercontent.com/Diocesano20266/idsje-sistema/main/logo-idsje.png');
            background-size: 55%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* Capa oscura encima del logo */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(7, 16, 31, 0.82);
        }

        /* Línea dorada superior */
        .topline {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            z-index: 10;
        }

        /* Contenedor centrado */
        .wrapper {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Marca arriba */
        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.3rem;
            animation: fadeUp 0.5s ease both;
        }

        .brand span { color: var(--gold); }

        .divider {
            width: 36px;
            height: 1px;
            background: var(--gold);
            opacity: 0.5;
            margin: 0.6rem auto 1.8rem;
            animation: fadeUp 0.5s 0.05s ease both;
        }

        /* Formulario */
        .form {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeUp 0.5s 0.1s ease both;
        }

        .field label {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
        }

        .field input {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            padding: 0.85rem 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            backdrop-filter: blur(4px);
        }

        .field input::placeholder { color: rgba(138,148,168,0.45); }

        .field input:focus {
            border-color: rgba(212,175,55,0.45);
            background: rgba(212,175,55,0.05);
        }

        .btn-login {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.9rem;
            background: var(--gold);
            color: var(--navy);
            border: none;
            border-radius: 2px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-login:hover   { background: #e0bd45; }
        .btn-login:active  { transform: scale(0.99); }
        .btn-login:disabled { background: #5a4e1a; color: #9a8a40; cursor: not-allowed; }

        .error-msg {
            display: none;
            padding: 0.65rem 0.9rem;
            background: rgba(220,53,69,0.1);
            border: 1px solid rgba(220,53,69,0.22);
            border-radius: 2px;
            font-size: 0.75rem;
            color: #f08080;
            text-align: center;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(138,148,168,0.3);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            z-index: 2;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="topline"></div>

<div class="wrapper">
    <div class="brand">IDS<span>JE</span></div>
    <div class="divider"></div>

    <div class="form">
        <div class="field">
            <label for="correo">Usuario</label>
            <input type="email" id="correo" placeholder="tu@correo.com"
                   onkeydown="if(event.key==='Enter') iniciarSesion()" autocomplete="username"/>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••"
                   onkeydown="if(event.key==='Enter') iniciarSesion()" autocomplete="current-password"/>
        </div>

        <button class="btn-login" onclick="iniciarSesion()" id="btn-entrar">
            Iniciar Sesión
        </button>

        <div class="error-msg" id="error-msg"></div>
    </div>
</div>

<div class="footer">Instituto Diocesano &ldquo;San Juan Evangelista&rdquo; &mdash; San Juan Opico, El Salvador</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
    import { supabase, verificarSesion } from './src/js/auth.js';

    (async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            const { data: usuario } = await supabase
                .from('usuarios')
                .select('rol')
                .eq('correo', session.user.email)
                .single();
            if (usuario) {
                window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
            }
        }
    })();

    window.iniciarSesion = async () => {
        const correo   = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;
        const errEl    = document.getElementById('error-msg');
        const btn      = document.getElementById('btn-entrar');
        errEl.style.display = 'none';

        if (!correo || !password) {
            errEl.textContent = 'Completá todos los campos.';
            errEl.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Ingresando...';

        const { error } = await supabase.auth.signInWithPassword({ email: correo, password });

        if (error) {
            errEl.textContent = 'Correo o contraseña incorrectos.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
            return;
        }

        const { data: usuario } = await supabase
            .from('usuarios')
            .select('rol')
            .eq('correo', correo)
            .single();

        if (!usuario) {
            errEl.textContent = 'Usuario no registrado en el sistema. Contactá al administrador.';
            errEl.style.display = 'block';
            await supabase.auth.signOut();
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
            return;
        }

        window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
    };
</script>

</body>
</html>
