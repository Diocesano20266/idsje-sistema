<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSJE — Lista de Actividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/ui.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#f0f4f8;color:#1e293b}

        .boleta-page{
            background:#fff;
            max-width:1000px;
            margin:24px auto;
            padding:14px 24px 24px;
            box-shadow:0 2px 12px rgba(0,0,0,.1);
            border-radius:8px;
            position:relative;
            font-size:10px;
            font-family:'Times New Roman', Times, serif;
        }

        .boleta-header{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1B3A6B;padding-bottom:8px;margin-bottom:10px;font-family:'DM Sans',sans-serif}
        .header-logos{flex-shrink:0}
        .logo-img{height:70px;width:70px;object-fit:cover;border-radius:8px;display:block}
        .logo-mined-img{height:52px !important;width:auto !important;object-fit:contain}
        .header-info{flex:1;text-align:center}
        .inst-nombre{font-family:'Times New Roman', Times, serif;font-weight:700;font-size:16px;color:#1B3A6B}
        .inst-dir{font-family:'Times New Roman', Times, serif;font-size:10px;color:#64748b;margin-top:2px}

        .boleta-titulo{text-align:center;font-family:'Times New Roman', Times, serif;font-weight:700;font-size:13px;margin:8px 0 4px;text-transform:uppercase}
        .datos-lista{font-size:11px;margin-bottom:12px;line-height:1.8}
        .datos-lista b{color:#1B3A6B}

        /* Tabla — filas = alumnos, N columnas en blanco con encabezado editable */
        .tabla-actividades{width:100%;border-collapse:collapse;font-size:10px}
        .tabla-actividades th{background:#1B3A6B;color:#fff;padding:4px;text-align:center;font-weight:700;vertical-align:bottom}
        .tabla-actividades td{border:1px solid #e2e8f0;padding:8px 4px;text-align:center;height:26px}
        .th-num{width:24px}
        .th-nombre{text-align:left!important;min-width:170px}
        .th-nf{width:34px;background:#334155!important}
        .td-num{color:#94a3b8}
        .td-nombre{text-align:left;font-weight:600;white-space:nowrap}
        .tabla-actividades tbody tr:nth-child(even) td{background:#f8fafc}

        /* Encabezados agrupados por categoría (35/35/30) */
        .th-grupo{font-size:9px;letter-spacing:.5px}
        .th-grupo-cot{background:#1B3A6B}
        .th-grupo-int{background:#2E5FAC}
        .th-grupo-exa{background:#0a1628}

        .input-actividad{width:100%;border:none;background:transparent;color:#fff;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;text-align:center;outline:none}
        .input-actividad::placeholder{color:rgba(255,255,255,.6)}

        .boleta-toolbar{text-align:right;margin-bottom:10px;display:flex;justify-content:flex-end;gap:10px}
        .btn-imprimir-boleta{background:#1B3A6B;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:11px;cursor:pointer;transition:background .2s}
        .btn-imprimir-boleta:hover{background:#2E5FAC}
        .aviso-actividades{background:#fef9e7;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;font-size:11px;color:#92400e;margin-bottom:10px;font-family:'DM Sans',sans-serif}

        @media print {
            .no-print{display:none!important}
            body{background:white}
            .boleta-page{box-shadow:none;margin:0;padding:14px 16px;border-radius:0;max-width:100%}
            .input-actividad{color:#fff}
        }
    </style>
</head>
<body>
    <div id="contenedor-actividades">
        <p style="padding:40px;text-align:center;color:#94a3b8">Cargando…</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./src/js/reporte-lista-actividades.js"></script>
</body>
</html>
