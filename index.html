<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSJE — Sistema Académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            background:
                linear-gradient(160deg, rgba(11,26,58,.93) 0%, rgba(5,12,28,.96) 100%),
                url('https://raw.githubusercontent.com/Diocesano20266/idsje-sistema/main/logo-idsje.png') center/cover no-repeat fixed;
        }

        /* Tarjeta glassmorphism */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        .login-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
            margin: 0 auto 22px;
            filter: drop-shadow(0 4px 14px rgba(0,0,0,.35));
        }

        .login-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.35;
            letter-spacing: .2px;
        }

        .login-sub {
            font-size: 12px;
            color: rgba(255,255,255,.55);
            text-align: center;
            margin-top: 10px;
            margin-bottom: 34px;
            line-height: 1.6;
        }

        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,.5);
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: #fff;
            background: rgba(0,0,0,.25);
            outline: none;
            transition: border-color .2s, background .2s;
        }
        .field input::placeholder { color: rgba(255,255,255,.3); }
        .field input:focus { border-color: #d4af37; background: rgba(0,0,0,.35); }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #0a1628;
            border: none;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s ease;
            margin-top: 8px;
            box-shadow: 0 4px 16px rgba(212,175,55,.25);
        }
        .btn-login:hover {
            background: #e3c25a;
            box-shadow: 0 8px 26px rgba(212,175,55,.5);
            transform: translateY(-1px);
        }
        .btn-login:disabled {
            background: rgba(255,255,255,.15);
            color: rgba(255,255,255,.4);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .error-msg {
            background: rgba(220,38,38,.15);
            border: 1px solid rgba(220,38,38,.4);
            color: #fca5a5;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 14px;
            display: none;
        }

        .footer-login {
            margin-top: 32px;
            font-size: 11px;
            color: rgba(255,255,255,.35);
            text-align: center;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .login-card { padding: 36px 26px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img class="login-logo" src="https://raw.githubusercontent.com/Diocesano20266/idsje-sistema/main/logo-idsje.png" alt="IDSJE">
        <div class="login-nombre">Instituto Diocesano<br>"San Juan Evangelista"</div>
        <p class="login-sub">Ingresá con tus credenciales institucionales</p>

        <div class="field">
            <label>Correo institucional</label>
            <input type="email" id="correo" placeholder="tu@correo.com"
                onkeydown="if(event.key==='Enter') iniciarSesion()">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••"
                onkeydown="if(event.key==='Enter') iniciarSesion()">
        </div>

        <button class="btn-login" onclick="iniciarSesion()" id="btn-entrar">
            Iniciar Sesión
        </button>

        <div class="error-msg" id="error-msg"></div>

        <div class="footer-login">
            Instituto Diocesano "San Juan Evangelista"<br>
            San Juan Opico, El Salvador · 2026
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase, verificarSesion } from './src/js/auth.js';

        // Si ya hay sesión activa, redirigir
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: usuario } = await supabase
                    .from('usuarios')
                    .select('rol')
                    .eq('correo', session.user.email)
                    .single();
                if (usuario) {
                    window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
                }
            }
        })();

        window.iniciarSesion = async () => {
            const correo   = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;
            const errEl    = document.getElementById('error-msg');
            const btn      = document.getElementById('btn-entrar');
            errEl.style.display = 'none';

            if (!correo || !password) {
                errEl.textContent = 'Completá todos los campos.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            const { error } = await supabase.auth.signInWithPassword({ email: correo, password });

            if (error) {
                errEl.textContent = 'Correo o contraseña incorrectos.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
                return;
            }

            // Obtener rol
            const { data: usuario } = await supabase
                .from('usuarios')
                .select('rol')
                .eq('correo', correo)
                .single();

            if (!usuario) {
                errEl.textContent = 'Usuario no registrado en el sistema. Contactá al administrador.';
                errEl.style.display = 'block';
                await supabase.auth.signOut();
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
                return;
            }

            window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
        };
    </script>
</body>
</html>
