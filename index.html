<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDSJE — Sistema Académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        html, body {
            height: 100%;
            background: #0b0f1a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #dde2ec;
            overflow: hidden;
        }

        /* Línea dorada superior */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: #d4af37;
            z-index: 10;
        }

        .wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            gap: 0;
        }

        /* Logo */
        .logo-wrap {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(212,175,55,0.35);
            margin-bottom: 1.2rem;
            animation: fadeUp 0.4s ease both;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Nombre institución */
        .inst-name {
            font-family: 'Playfair Display', serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #8a94a8;
            margin-bottom: 0.3rem;
            text-align: center;
            animation: fadeUp 0.4s 0.05s ease both;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .inst-full {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 600;
            color: #dde2ec;
            letter-spacing: 0.05em;
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeUp 0.4s 0.08s ease both;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* Línea separadora */
        .sep {
            width: 100%;
            max-width: 360px;
            height: 1px;
            background: rgba(212,175,55,0.2);
            margin-bottom: 2rem;
            animation: fadeUp 0.4s 0.1s ease both;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* Formulario */
        .form {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeUp 0.4s 0.12s ease both;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .field label {
            display: block;
            font-size: 0.62rem;
            font-weight: 600;
            color: #6b7590;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .field input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-top: none;
            border-left: none;
            border-right: none;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 0.75rem 0.2rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: #dde2ec;
            outline: none;
            background: transparent;
            transition: border-color 0.2s;
        }

        .field input::placeholder { color: rgba(107,117,144,0.4); }
        .field input:focus { border-bottom-color: #d4af37; }

        .btn-login {
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.85rem;
            background: transparent;
            color: #d4af37;
            border: 1px solid rgba(212,175,55,0.5);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-login:hover {
            background: #d4af37;
            color: #0b0f1a;
        }

        .btn-login:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            padding: 0.6rem 0;
            font-size: 0.72rem;
            color: #f08080;
            text-align: center;
            border-top: 1px solid rgba(220,53,69,0.2);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 1.2rem;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.58rem;
            color: rgba(107,117,144,0.3);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="logo-wrap">
        <img src="https://raw.githubusercontent.com/Diocesano20266/idsje-sistema/main/logo-idsje.png" alt="IDSJE"/>
    </div>

    <div class="inst-name">Sistema Académico · 2026</div>
    <div class="inst-full">Instituto Diocesano "San Juan Evangelista"</div>

    <div class="sep"></div>

    <div class="form">
        <div class="field">
            <label for="correo">Usuario</label>
            <input type="email" id="correo" placeholder="tu@correo.com"
                   onkeydown="if(event.key==='Enter') iniciarSesion()" autocomplete="username"/>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••"
                   onkeydown="if(event.key==='Enter') iniciarSesion()" autocomplete="current-password"/>
        </div>

        <button class="btn-login" onclick="iniciarSesion()" id="btn-entrar">
            Iniciar Sesión
        </button>

        <div class="error-msg" id="error-msg"></div>
    </div>
</div>

<div class="footer">San Juan Opico, La Libertad &mdash; El Salvador</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
    import { supabase, verificarSesion } from './src/js/auth.js';

    (async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            const { data: usuario } = await supabase
                .from('usuarios')
                .select('rol')
                .eq('correo', session.user.email)
                .single();
            if (usuario) {
                window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
            }
        }
    })();

    window.iniciarSesion = async () => {
        const correo   = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;
        const errEl    = document.getElementById('error-msg');
        const btn      = document.getElementById('btn-entrar');
        errEl.style.display = 'none';

        if (!correo || !password) {
            errEl.textContent = 'Completá todos los campos.';
            errEl.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Verificando...';

        const { error } = await supabase.auth.signInWithPassword({ email: correo, password });

        if (error) {
            errEl.textContent = 'Credenciales incorrectas.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
            return;
        }

        const { data: usuario } = await supabase
            .from('usuarios')
            .select('rol')
            .eq('correo', correo)
            .single();

        if (!usuario) {
            errEl.textContent = 'Usuario no registrado. Contactá al administrador.';
            errEl.style.display = 'block';
            await supabase.auth.signOut();
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
            return;
        }

        window.location.href = usuario.rol === 'admin' ? './admin.html' : './docente.html';
    };
</script>

</body>
</html>
